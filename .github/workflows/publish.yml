name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing: GitHub mints a short-lived OIDC token that npm
      # exchanges for publish rights. No NPM_TOKEN secret is involved.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.1; the bundled one is older.
      - run: npm install -g npm@latest
      - run: npm --version
      # Lifecycle scripts are skipped: the client bundle is committed.
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # Re-pushing a tag must not fail the job.
      - name: Check whether this version is already published
        id: published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is already on npm; skipping publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.already == 'false'
        run: npm publish --access public --provenance

