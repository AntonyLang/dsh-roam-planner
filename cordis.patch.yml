# dsh-roam-planner bundle patch.
#
# Everything a deployment may want to change lives in this row's `config`, so
# changing it never requires editing plugin code (and never a module reload):
#
#   basemapId     which basemap is selected on first use     (default "osm")
#   basemaps      the provider catalogue shown in the Basemap menu; [] = built-ins
#   geocoder      "nominatim" | "amap" | "off"               (default "nominatim")
#   amapKey       Amap Web-service key, also enables geocoder "amap"
#   defaultCity   city used to disambiguate place names, e.g. "苏州"
#   dataDir       where the JSON fallback store lives
#
# Example:
#
#   config:
#     basemapId: osm
#     defaultCity: 苏州
#     basemaps:
#       - id: osm
#         label: OpenStreetMap
#         url: https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png
#         subdomains: [a, b, c]
#         attribution: "&copy; OpenStreetMap contributors"
#         maxZoom: 19
#         crs: WGS84
#       - id: amap
#         label: 高德地图
#         url: https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}
#         subdomains: ["1", "2", "3", "4"]
#         attribution: "&copy; 高德地图"
#         maxZoom: 18
#         crs: GCJ02
#
# Which basemap is *currently* shown is interaction state, not config: the panel
# remembers it locally and falls back to `basemapId` on first use.

- insert:
    - id: roam-planner
      name: '@antony/dsh-roam-planner'
      config: {}
